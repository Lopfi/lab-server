services:
  donetick:
    image: donetick/donetick
    container_name: donetick
    restart: unless-stopped
    ports:
      - '3006:2021'
    volumes:
      - data:/donetick-data
      - ./config:/config
    environment:
      - DT_ENV=selfhosted
      - DT_SQLITE_PATH=/donetick-data/donetick.db
      - TZ=Europe/Berlin
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2021/"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - caddy

networks:
  caddy:
    name: caddy
    external: true

volumes:
  data:      